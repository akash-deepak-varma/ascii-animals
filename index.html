<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <!-- Dark from the first paint, before page.css arrives. -->
    <style>html, body { background: #06070c; }</style>
    <!-- Only Chromium can run an SVG filter inside backdrop-filter; everyone else gets frosted glass.
         An external file, because extension pages forbid inline scripts. -->
    <script src="./liquid-detect.js"></script>
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>

    <!-- Displacement map for the liquid-glass refraction. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="top-bar">
      <div class="choices glass" role="radiogroup" aria-label="Animal"></div>
    </div>

    <main class="stage">
      <!-- The logo is a placeholder mark cut out of a screenshot; swap public/dia-logo.png for your own. -->
      <div class="masthead">
        <div class="logo" role="img" aria-label="ASCII Animals"></div>
        <h1 class="greeting"></h1>
      </div>
      <form class="composer glass" autocomplete="off" role="search">
        <div class="composer-field">
          <svg class="composer-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <textarea name="prompt" rows="1" placeholder="Search the web or type a URL" aria-label="Search the web or type a URL"></textarea>
        </div>
        <div class="composer-bar">
          <div class="tools">
            <button type="button" class="icon-btn voice" aria-label="Voice search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
            </button>
            <button type="submit" class="send" aria-label="Search" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </form>
      <nav class="shortcuts" aria-label="Shortcuts" hidden></nav>
    </main>

    <script type="module" src="./demo.ts"></script>
  </body>
</html>
